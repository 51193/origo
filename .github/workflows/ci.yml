name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml

      - name: Lint repository scripts
        run: bash scripts/lint-scripts.sh

  doc-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # DocSync revision planning reads the complete path history of
          # every docs file. A multi-commit push only runs CI for the final
          # commit, so a shallow fetch would make the pushed history
          # invisible and cause missed revision increments.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: DocSync — generate & validate
        run: |
          dotnet run --project tools/DocSyncTool -- generate
          dotnet run --project tools/DocSyncTool -- validate

      - name: Commit auto-generated files (push only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-sync revisions, navigation and status files"
            git push
          fi

      - name: Check generated files (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs/; then
            echo "ERROR: Generated doc files (README.md hubs, .sync-status.json) are out of date."
            echo ""
            echo "Run the following command locally and commit the results:"
            echo "  dotnet run --project tools/DocSyncTool -- generate"
            echo ""
            exit 1
          fi

  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Format check
        run: bash scripts/format.sh

      # scripts/test.sh: restore + build + dotnet test; all test projects run Coverlet.
      # Benchmarks (Category=Benchmark) are excluded here and run in the next step.
      # Coverage gate: >= 90% line coverage across all projects.
      - name: CI — build, tests, line coverage gates (>= 90%)
        run: bash scripts/test.sh

      # Performance benchmarks covering TypedData and core subsystems (entity lifecycle,
      # observer topology, DataSourceNode, Blackboard, save persistence, concurrent queue,
      # random number generator, strategy performance, and Godot adapter throughput).
      - name: Benchmarks — TypedData + subsystem baselines
        run: bash scripts/benchmark.sh

  godot-integration-tests:
    needs: build-and-test
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Install Godot headless dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcursor1 libxinerama1 libxrandr2 libasound2t64 libpulse0 libgl1 libfontconfig1

      - name: Godot headless integration tests
        run: bash scripts/godot-test.sh
