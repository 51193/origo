name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Format check
        run: bash scripts/format.sh

      # scripts/test.sh: restore + build + dotnet test; all test projects run Coverlet.
      # Benchmarks (Category=Benchmark) are excluded here and run in the next step.
      # Coverage gates:
      #   Origo.Core             >= 90% line
      #   Origo.ConsoleBridge    >= 80% line
      #   Origo.GodotAdapter     >= 85% line (testable subset, engine-dependent code excluded)
      #   Origo.SourceGeneration >= 85% line
      - name: CI — build, tests, line coverage gates (Core >= 90%, ConsoleBridge >= 80%, GodotAdapter >= 85%, SourceGeneration >= 85%)
        run: bash scripts/test.sh

      # Performance benchmarks covering TypedData and core subsystems (entity lifecycle,
      # observer topology, DataSourceNode, Blackboard, save persistence, concurrent queue,
      # random number generator, strategy performance, and Godot adapter throughput).
      - name: Benchmarks — TypedData + subsystem baselines
        run: bash scripts/benchmark.sh

  godot-integration-tests:
    needs: build-and-test
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Install Godot headless dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcursor1 libxinerama1 libxrandr2 libasound2t64 libpulse0 libgl1 libfontconfig1

      - name: Godot headless integration tests
        run: bash scripts/godot-test.sh
