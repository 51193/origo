name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # scripts/ci.sh: restore + build + dotnet test; all three test projects run Coverlet.
      # Coverage gates:
      #   Origo.Core          >= 90% line
      #   Origo.ConsoleBridge >= 80% line
      #   Origo.GodotAdapter  >= 85% line (testable subset, engine-dependent code excluded)
      - name: CI — build, tests, line coverage gates (Core >= 90%, ConsoleBridge >= 80%, GodotAdapter >= 85%)
        run: bash scripts/ci.sh
