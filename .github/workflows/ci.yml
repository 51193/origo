name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml

      - name: Lint repository scripts
        run: bash scripts/lint-scripts.sh

  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Format check
        run: bash scripts/format.sh

      # Shell API baseline gate: builds the shell projects in Release and
      # verifies the tracked Roslyn JSON inventory against the committed
      # baseline. Unapproved additions, removals, and signature changes fail.
      - name: Shell API baseline gate
        run: bash scripts/api-inventory.sh

      # scripts/test.sh: restore + build + dotnet test; all test projects run Coverlet.
      # Benchmarks (Category=Benchmark) are excluded here and run in the next step.
      # Coverage gate: >= 90% line coverage across all projects.
      - name: CI — build, tests, line coverage gates (>= 90%)
        run: bash scripts/test.sh

      # Performance benchmarks covering TypedData and core subsystems (entity lifecycle,
      # observer topology, DataSourceNode, Blackboard, save persistence, concurrent queue,
      # random number generator, strategy performance, and Godot adapter throughput).
      - name: Benchmarks — TypedData + subsystem baselines
        run: bash scripts/benchmark.sh

  godot-integration-tests:
    needs: build-and-test
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v6
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Install Godot headless dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcursor1 libxinerama1 libxrandr2 libasound2t64 libpulse0 libgl1 libfontconfig1

      - name: Godot headless integration tests
        run: bash scripts/godot-test.sh

      # Packs the shell packages into a fresh local feed, restores the tracked
      # consumer fixture through PackageReference only, builds with warnings as
      # errors, rejects kernel compile-asset leakage, and starts the public
      # OrigoDefaultEntry path headlessly.
      - name: Shell-only package consumer smoke
        run: bash scripts/package-consumer-smoke.sh
