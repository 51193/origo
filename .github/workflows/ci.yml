name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # scripts/ci.sh: restore + build + dotnet test; all test projects run Coverlet.
      # Benchmarks (Category=Benchmark) are excluded here and run in the next step.
      # Coverage gates:
      #   Origo.Core             >= 90% line
      #   Origo.ConsoleBridge    >= 80% line
      #   Origo.GodotAdapter     >= 85% line (testable subset, engine-dependent code excluded)
      #   Origo.SourceGeneration >= 85% line
      - name: CI — build, tests, line coverage gates (Core >= 90%, ConsoleBridge >= 80%, GodotAdapter >= 85%, SourceGeneration >= 85%)
        run: bash scripts/ci.sh

      # Source-generation performance benchmarks, run once in their own step.
      - name: Benchmarks — generated TypedData vs unoptimized boxing
        run: bash scripts/benchmark.sh
