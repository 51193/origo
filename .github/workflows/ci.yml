name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run for the same ref replaces the older one; the release and weekly
# workflows keep their own non-cancelling groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGO_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      # Fork pull request branches are outside the repository owners' control;
      # only same-repository branches are validated against the naming rule.
      ORIGO_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          timeout 300 sudo apt-get -o Acquire::Retries=3 update -qq
          timeout 300 sudo apt-get -o Acquire::Retries=3 install -y -qq shellcheck python3-yaml

      - name: Lint repository scripts
        run: bash scripts/bash/lint-scripts.sh

  bash-build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          # The previous-release API baseline is selected from tags. The
          # default depth-1 checkout has no tags, which would silently skip
          # the previous-package comparison in the shell API gate.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Format check
        run: bash scripts/bash/format.sh

      # A shallow checkout silently disables the previous-package comparison.
      # Fail before the API gate if the formal release tags are unavailable.
      - name: Verify release tags for the API baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! git tag --list 'v*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: no formal release tag is available in this checkout." >&2
            echo "Set fetch-depth: 0 so previous-package API validation can run." >&2
            exit 1
          fi

      # Shell API baseline gate: builds the shell projects in Release and
      # verifies the tracked Roslyn JSON inventory against the committed
      # baseline. Unapproved additions, removals, and signature changes fail.
      - name: Shell API baseline gate
        run: bash scripts/bash/api-inventory.sh

      # scripts/bash/test.sh: restore + build + dotnet test; all test projects run Coverlet.
      # Benchmarks (Category=Benchmark) are excluded here and run in the next step.
      # Coverage gate: >= 90% line coverage across all projects.
      - name: CI — build, tests, line coverage gates (>= 90%)
        run: bash scripts/bash/test.sh

      # Performance benchmarks covering TypedData and core subsystems (entity lifecycle,
      # observer topology, DataSourceNode, Blackboard, save persistence, concurrent queue,
      # random number generator, strategy performance, and Godot adapter throughput).
      - name: Benchmarks — TypedData + subsystem baselines
        run: bash scripts/bash/benchmark.sh

  # Dedicated Bash development-suite parity check. Paired with the
  # PowerShell check below.
  bash-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Bash/PowerShell development-suite parity
        run: bash scripts/bash/test-dev-suite.sh

      - name: Bash API-inventory parent regression
        run: bash scripts/bash/test-api-inventory-parent.sh

  # PowerShell lint check paired with bash-lint.
  powershell-lint:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ORIGO_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      ORIGO_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python validation dependencies
        run: python -m pip install pyyaml

      - name: Lint PowerShell scripts
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\powershell\lint-scripts.ps1

  # Full Windows PowerShell suite, paired with the Bash checks above. It runs
  # the same gate sequence on Windows PowerShell so the two platform script
  # sets cannot drift silently.
  powershell-checks:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ORIGO_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      # Fork pull request branches are outside the repository owners' control;
      # only same-repository branches are validated against the naming rule.
      ORIGO_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The API baseline selects the previous formal release tag.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python validation dependencies
        run: python -m pip install pyyaml

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v6
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Windows PowerShell gates
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\powershell\ci.ps1

  godot-integration-tests:
    needs: bash-build-and-test
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v6
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Install Godot headless dependencies
        run: |
          timeout 300 sudo apt-get -o Acquire::Retries=3 update -qq
          timeout 300 sudo apt-get -o Acquire::Retries=3 install -y -qq libxcursor1 libxinerama1 libxrandr2 libasound2t64 libpulse0 libgl1 libfontconfig1

      - name: Godot headless integration tests
        run: bash scripts/bash/godot-test.sh

      # Packs the shell packages into a fresh local feed, restores the tracked
      # consumer fixture through PackageReference only, builds with warnings as
      # errors, rejects kernel compile-asset leakage, and starts the public
      # OrigoDefaultEntry path headlessly.
      - name: Shell-only package consumer smoke
        run: bash scripts/bash/package-consumer-smoke.sh
