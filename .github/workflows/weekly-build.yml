name: Weekly Build

on:
  schedule:
    # Monday 02:30 UTC. Scheduled runs evaluate exactly the week that just
    # ended: [previous Monday 00:00, current Monday 00:00) UTC. Idle weeks
    # publish nothing, and a commit made in the first hours of Monday cannot
    # leak into the ended-week window or be published twice.
    - cron: '30 2 * * 1'
  workflow_dispatch:

concurrency:
  # A manual dispatch must never race the scheduled run into a push conflict.
  group: weekly-build
  cancel-in-progress: false

permissions:
  contents: write
  # The release pipeline is started explicitly with 'gh workflow run'.
  actions: write

jobs:
  weekly-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check for commits in the weekly window
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The step below tags a commit and pushes only that tag; only main
          # may run this workflow so the snapshot describes main's history and
          # a manual dispatch from a feature branch cannot publish unreleased
          # work under a release tag.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "ERROR: weekly-build only runs on refs/heads/main (got '${GITHUB_REF:-unset}')." >&2
            exit 1
          fi

          # Scheduled runs evaluate exactly [previous Monday 00:00, current
          # Monday 00:00) so a commit in the first hours of Monday is picked
          # up by the following week's run instead of being published twice.
          # Manual dispatch intentionally leaves the window open to now so a
          # human can snapshot the current partial week on demand.
          WEEK_WINDOW="$(python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          current_monday = (now - timedelta(days=now.weekday())).replace(
              hour=0, minute=0, second=0, microsecond=0)
          previous_monday = current_monday - timedelta(days=7)
          ended_week_end = current_monday - timedelta(seconds=1)
          print(previous_monday.strftime('%Y-%m-%dT%H:%M:%SZ'))
          print(ended_week_end.strftime('%Y-%m-%dT%H:%M:%SZ'))
          PY
          )"
          WEEK_START="$(printf '%s\n' "$WEEK_WINDOW" | sed -n '1p')"
          WEEK_END="$(printf '%s\n' "$WEEK_WINDOW" | sed -n '2p')"
          echo "Weekly window starts at: $WEEK_START"

          if [[ "${GITHUB_EVENT_NAME:-workflow_dispatch}" == "schedule" ]]; then
            REVISION_ARGS=(--since="$WEEK_START" --until="$WEEK_END")
            echo "Scheduled run window ends at: $WEEK_END"
          else
            REVISION_ARGS=(--since="$WEEK_START")
            echo "Manual dispatch window includes commits up to now."
          fi

          if ! WINDOW_COMMITS="$(git rev-list "${REVISION_ARGS[@]}" HEAD)"; then
            echo "ERROR: git rev-list failed while evaluating the weekly window." >&2
            exit 1
          fi
          if [[ -n "$WINDOW_COMMITS" ]]; then
            echo "Commits in the weekly window: $(printf '%s\n' "$WINDOW_COMMITS" | wc -l)"
          fi

          # Reuse only the numeric base of the current stamp, so 0.0.11,
          # 0.0.11-nightly, v0.0.11 and 0.0.11-nightly.YYYYMMDD all yield 0.0.11
          # and a manual base bump (0.0.10 -> 0.0.11) moves the snapshot with it.
          BASE_VERSION="$(grep -oP '<Version>\K[^<]+' Directory.Build.props | head -1 \
              | tr -d '[:space:]' | sed -E 's/^[vV]//; s/[-+].*$//')"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: cannot derive base version from Directory.Build.props: '$BASE_VERSION'" >&2
            exit 1
          fi

          # Refresh tags so a formal release that finished after checkout is
          # visible to the fail-fast comparison.
          git fetch --tags --force origin >/dev/null

          # A snapshot must sort above every formal release already published.
          # Otherwise a forgotten post-release base bump would publish
          # 0.1.1-nightly.* below the existing 0.1.1 forever. The tested helper
          # keeps the comparison out of an unpinned workflow shell block.
          LATEST_FORMAL="$(git tag --list 'v[0-9]*' --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [[ -n "$LATEST_FORMAL" ]]; then
            bash scripts/bash/check-weekly-base.sh "$BASE_VERSION" "${LATEST_FORMAL#v}"
          fi

          DATE="$(date -u +%Y%m%d)"
          NEW_VERSION="${BASE_VERSION}-nightly.${DATE}"
          TAG="v${NEW_VERSION}"

          # Ask the remote, not the checkout: a tag created by a concurrent run
          # is not in this clone yet, and pushing over it would fail the job.
          # A tag is only "done" when its GitHub Release is published with the
          # expected snapshot assets. Draft/incomplete/stable snapshots are
          # recovered too, and all orphans are dispatched rather than consuming
          # the whole run and dropping today's window.
          ORPHAN_TAGS_FILE="${RUNNER_TEMP}/origo-orphan-tags.txt"
          : > "$ORPHAN_TAGS_FILE"
          expected_snapshot_assets() {
            local version="$1"
            printf '%s\n' \
              "Origo.ConsoleBridge.${version}.nupkg" \
              "Origo.Core.${version}.nupkg" \
              "Origo.Core.Contracts.${version}.nupkg" \
              "Origo.Core.Kernel.${version}.nupkg" \
              "Origo.GodotAdapter.${version}.nupkg" \
              "origo-docs-${version}.tar.gz" \
              "origo-docs-${version}.zip" \
              "origo-source-${version}.tar.gz" \
              "nuget.config" \
              | LC_ALL=C sort | paste -sd, -
          }
          release_is_complete() {
            local release_tag="$1"
            local version="${release_tag#v}"
            local state draft prerelease assets expected
            expected="$(expected_snapshot_assets "$version")"
            if state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}"                 --jq '[.draft, .prerelease, ([.assets[].name] | sort | join(","))] | @tsv' 2>&1)"; then
              IFS=$'\t' read -r draft prerelease assets <<< "$state"
              # softprops creates the prerelease before uploading; a failed
              # upload can leave a published prerelease with only some assets.
              # Check the exact identities, not just the count: nine unrelated
              # assets would otherwise mark a release complete.
              [[ "$draft" == "false" && "$prerelease" == "true" && "$assets" == "$expected" ]]
              return
            fi
            if [[ "$state" == *"HTTP 404"* || "$state" == *"Not Found"* ]]; then
              return 1
            fi
            echo "ERROR: GitHub release lookup for ${release_tag} failed: ${state}" >&2
            exit 1
          }
          record_orphan() {
            local orphan="$1"
            grep -qxF "$orphan" "$ORPHAN_TAGS_FILE" || printf '%s\n' "$orphan" >> "$ORPHAN_TAGS_FILE"
          }
          while IFS= read -r CANDIDATE; do
            [[ -n "$CANDIDATE" ]] || continue
            if ! release_is_complete "$CANDIDATE"; then
              record_orphan "$CANDIDATE"
            fi
          done < <(git tag --list "v${BASE_VERSION}-nightly.*" --sort=-version:refname)
          if [[ -s "$ORPHAN_TAGS_FILE" ]]; then
            echo "Recovering orphaned snapshot tags: $(paste -sd, "$ORPHAN_TAGS_FILE")"
            echo "dispatch_existing=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ -z "$WINDOW_COMMITS" ]]; then
            echo "No commits in the weekly window; orphan recovery (if any) runs in the dispatch step."
            exit 0
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if release_is_complete "$TAG"; then
              echo "Tag ${TAG} and its GitHub Release already exist; nothing to publish."
              exit 0
            fi
            echo "Tag ${TAG} exists (remote-only race) but its GitHub Release is incomplete; dispatching the release pipeline."
            record_orphan "$TAG"
            echo "dispatch_existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing weekly snapshot version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit, and tag
        if: steps.check.outputs.new_version != ''
        shell: bash
        run: |
          python3 scripts/python/write-version-stamp.py "${{ steps.check.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "chore: bump version to ${{ steps.check.outputs.new_version }} for weekly build"

          TAG="${{ steps.check.outputs.tag }}"
          git tag -a "$TAG" -m "Weekly snapshot ${{ steps.check.outputs.new_version }}"

          # Only the tag is pushed. The commit already carries the version
          # stamps of the tag, so the release pipeline finds nothing to rewrite
          # and never creates a release commit, which means branch rules that
          # require a pull request cannot block a snapshot.
          git push origin "refs/tags/${TAG}"

      - name: Dispatch the release pipeline for the snapshot tag
        if: steps.check.outputs.new_version != '' || steps.check.outputs.dispatch_existing == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          # A tag pushed with GITHUB_TOKEN does not start the Release workflow:
          # GitHub suppresses runs caused by that token, so the 'push: tags'
          # trigger never fires here. workflow_dispatch is the documented
          # exception, so the pipeline is started explicitly instead of relying
          # on a PAT (or GitHub App token) in repository secrets.
          ORPHAN_TAGS_FILE="${RUNNER_TEMP}/origo-orphan-tags.txt"
          if [[ -f "$ORPHAN_TAGS_FILE" ]]; then
            while IFS= read -r ORPHAN_TAG; do
              [[ -n "$ORPHAN_TAG" ]] || continue
              gh workflow run release.yml --ref main -f tag="${ORPHAN_TAG}" -f snapshot=true
              echo "Dispatched release.yml for orphaned tag ${ORPHAN_TAG}."
            done < "$ORPHAN_TAGS_FILE"
          fi
          if [[ -n "${TAG:-}" ]]; then
            gh workflow run release.yml --ref main -f tag="${TAG}" -f snapshot=true
            echo "Dispatched release.yml for ${TAG}."
          fi
