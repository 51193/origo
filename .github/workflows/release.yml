name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PROPS_VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props | head -1)
          TAG_BASE="${TAG_VERSION%%-*}"
          PROPS_BASE="${PROPS_VERSION%%-*}"
          if [[ "$TAG_BASE" != "$PROPS_BASE" ]]; then
            echo "ERROR: Tag version 'v$TAG_VERSION' base ($TAG_BASE) does not match Directory.Build.props version base ($PROPS_BASE)."
            exit 1
          fi
          echo "Tag version v$TAG_VERSION matches Directory.Build.props version $PROPS_VERSION."

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Origo.sln

      - name: Format check
        run: bash scripts/format.sh

      - name: Build
        run: dotnet build Origo.sln --no-restore --configuration Release

      - name: Test with coverage gates
        run: |
          dotnet test Origo.sln \
            --no-build --configuration Release \
            --verbosity normal \
            --filter "Category!=Benchmark"

      - name: Benchmarks — generated TypedData vs unoptimized boxing
        run: bash scripts/benchmark.sh

      - name: Pack Origo.Core
        run: dotnet pack Origo.Core/Origo.Core.csproj --no-build --configuration Release --output ./artifacts

      - name: Pack Origo.GodotAdapter
        run: dotnet pack Origo.GodotAdapter/Origo.GodotAdapter.csproj --configuration Release --output ./artifacts

      - name: Pack Origo.ConsoleBridge
        run: dotnet pack Origo.ConsoleBridge/Origo.ConsoleBridge.csproj --no-build --configuration Release --output ./artifacts

      - name: Copy NuGet config to artifacts
        run: cp nuget.config.example ./artifacts/nuget.config

      - name: Package documentation snapshot
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          DIRNAME="origo-docs-${VERSION}"
          mkdir -p "${DIRNAME}/docs"
          cp -r docs/. "${DIRNAME}/docs/"
          cp AGENTS.md "${DIRNAME}/"
          cp CHANGELOG.md "${DIRNAME}/"
          mkdir -p ./artifacts
          tar -czf "./artifacts/${DIRNAME}.tar.gz" "${DIRNAME}"
          zip -rq "./artifacts/${DIRNAME}.zip" "${DIRNAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true

  godot-integration-tests:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Install Godot headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcursor1 libxinerama1 libxrandr2 libasound2t64 libpulse0 libgl1 libfontconfig1

      - name: Godot headless integration tests
        run: bash scripts/godot-test.sh
