name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PROPS_VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props | head -1)
          PROPS_VERSION="${PROPS_VERSION%%-*}"
          if [[ "$TAG_VERSION" != "$PROPS_VERSION" ]]; then
            echo "ERROR: Tag version 'v$TAG_VERSION' does not match Directory.Build.props version '$PROPS_VERSION'."
            exit 1
          fi
          echo "Tag version v$TAG_VERSION matches Directory.Build.props version $PROPS_VERSION."

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Origo.sln

      - name: Build
        run: dotnet build Origo.sln --no-restore --configuration Release

      - name: Test with coverage gates
        run: |
          dotnet test Origo.sln \
            --no-build --configuration Release \
            --verbosity normal \
            --filter "Category!=Benchmark"

      - name: Pack Origo.Core
        run: dotnet pack Origo.Core/Origo.Core.csproj --no-build --configuration Release --output ./artifacts

      # GodotAdapter packaging uses continue-on-error because the Godot.NET.Sdk
      # toolchain may not be fully available in the release runner environment,
      # which would otherwise block the entire release (Core, ConsoleBridge, and
      # documentation snapshot).
      - name: Pack Origo.GodotAdapter
        run: dotnet pack Origo.GodotAdapter/Origo.GodotAdapter.csproj --no-build --configuration Release --output ./artifacts
        continue-on-error: true

      - name: Pack Origo.ConsoleBridge
        run: dotnet pack Origo.ConsoleBridge/Origo.ConsoleBridge.csproj --no-build --configuration Release --output ./artifacts

      - name: Copy NuGet config to artifacts
        run: cp nuget.config.example ./artifacts/nuget.config

      - name: Package documentation snapshot
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          DIRNAME="origo-docs-${VERSION}"
          mkdir -p "${DIRNAME}/docs"
          cp -r docs/. "${DIRNAME}/docs/"
          cp AGENTS.md "${DIRNAME}/"
          cp CHANGELOG.md "${DIRNAME}/"
          mkdir -p ./artifacts
          tar -czf "./artifacts/${DIRNAME}.tar.gz" "${DIRNAME}"
          zip -rq "./artifacts/${DIRNAME}.zip" "${DIRNAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
