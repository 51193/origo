name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to release (e.g. v0.0.10-nightly.20260914)'
        required: true
        type: string
      snapshot:
        description: 'Snapshot build: publish the GitHub Release as a pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  # A dispatched run has no tag ref, so the input is the group key there.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  godot-integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatched run is based on main; the gate must still test the tag.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v6
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Install Godot headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcursor1 libxinerama1 libxrandr2 libasound2t64 libpulse0 libgl1 libfontconfig1

      - name: Godot headless integration tests
        run: bash scripts/godot-test.sh

  release:
    needs: godot-integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Explicit ref keeps actions/checkout from rejecting a re-run after
          # this workflow moved the tag: it would otherwise compare the tag's
          # new peeled commit with the original event SHA.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve release tag
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # 'push' carries the tag in the ref; 'workflow_dispatch' does not, so
          # the tag arrives as an input instead. The weekly snapshot job starts
          # this pipeline with 'gh workflow run release.yml -f tag=...' because
          # a tag pushed with GITHUB_TOKEN does not fire the 'push: tags'
          # trigger; its github.ref_name is then the dispatching branch.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "ERROR: dispatch release.yml from refs/heads/main (got '${REF}')." >&2
              exit 1
            fi
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: release tag '${TAG}' must be v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<suffix>." >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --refs origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: tag '${TAG}' does not exist on origin." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag ${TAG} (event: ${EVENT_NAME})."

      - name: Resolve current tag commit
        id: tag-commit
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A previous run of this same workflow may already have moved the tag
          # to a release commit (reruns/concurrency), so build the tag as it
          # exists now instead of the event payload SHA.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # The ref SHA is compared against the remote when moving the tag; the
          # peeled commit is what the workflow builds. They differ for
          # annotated tags.
          TAG_REF_SHA="$(git rev-parse "refs/tags/${TAG}")"
          TAG_COMMIT_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "$TAG_COMMIT_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag ${TAG} points at ${TAG_COMMIT_SHA}; checking out that commit."
            git checkout --force "$TAG_COMMIT_SHA"
          fi
          echo "base_sha=${TAG_REF_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_commit=${TAG_COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fetch trusted release validators
        run: |
          set -euo pipefail
          # Validation code must come from reviewed main, not from the tag tree
          # (a tag-triggered workflow still runs the workflow file at the tag;
          # tag creation remains a trusted operation).
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          mkdir -p .release-validators
          git show refs/remotes/origin/main:scripts/verify-release-provenance.sh > .release-validators/verify-release-provenance.sh
          git show refs/remotes/origin/main:scripts/validate-release-source.sh > .release-validators/validate-release-source.sh
          git show refs/remotes/origin/main:scripts/verify-release.sh > .release-validators/verify-release.sh

      - name: Verify release tag provenance
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
          BASE_COMMIT_SHA: ${{ steps.tag-commit.outputs.base_commit }}
        run: bash .release-validators/verify-release-provenance.sh "$TAG" "$BASE_COMMIT_SHA"

      - name: Sync version from tag
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The release workflow builds from a tag checkout. Keep the package
          # version authoritative to the tag: rewrite the version stamps in
          # Directory.Build.props before any validation or build step runs.
          TAG_VERSION="${TAG#v}"
          if [[ -z "$TAG_VERSION" || "$TAG" == "$TAG_VERSION" ]]; then
            echo "ERROR: release tag '$TAG' does not start with 'v'." >&2
            exit 1
          fi

          python3 scripts/write-version-stamp.py "$TAG_VERSION"

          echo "::group::Version stamps after sync"
          grep -nE '<(Version|AssemblyVersion|FileVersion)>' Directory.Build.props
          echo "::endgroup::"

      - name: Commit synced version
        id: release-commit
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Directory.Build.props; then
            changed=false
            echo "Directory.Build.props already matches ${TAG}; no release commit needed."
          else
            changed=true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Directory.Build.props
            git commit -m "chore(release): sync version stamps to ${TAG}"
            echo "::group::Release commit"
            git show --stat --oneline HEAD
            echo "::endgroup::"
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          PROPS_VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props | head -1)
          if [[ "$TAG_VERSION" != "$PROPS_VERSION" ]]; then
            echo "ERROR: version sync failed: tag 'v$TAG_VERSION' != Directory.Build.props version '$PROPS_VERSION'."
            exit 1
          fi
          echo "Tag version v$TAG_VERSION matches Directory.Build.props version $PROPS_VERSION."

      - name: Verify release metadata
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          # verify-release.sh reads TAG_VERSION from the environment. Use the
          # copy fetched from main, not the tag tree's verifier.
          export TAG_VERSION="${TAG#v}"
          bash .release-validators/verify-release.sh

      - name: Install script lint dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml

      - name: Lint scripts and workflows
        env:
          ORIGO_BRANCH_NAME: refs/tags/${{ steps.resolve-tag.outputs.tag }}
        run: bash scripts/lint-scripts.sh

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Godot binary
        uses: actions/cache@v6
        with:
          path: .godot_binary
          key: godot-${{ runner.os }}-${{ hashFiles('Origo.GodotAdapter/Origo.GodotAdapter.csproj') }}

      - name: Format check
        run: bash scripts/format.sh

      - name: Shell API baseline gate
        env:
          ORIGO_CURRENT_RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: bash scripts/api-inventory.sh

      - name: CI — build, tests, line coverage gates (>= 90%)
        run: bash scripts/test.sh

      - name: Benchmarks — TypedData + subsystem baselines
        run: bash scripts/benchmark.sh

      # Packaged consumer startup is a release gate: packs a fresh local feed,
      # restores only shell packages, runs the CS0246 negative probe, and starts
      # OrigoDefaultEntry headlessly.
      - name: Shell-only package consumer smoke
        run: bash scripts/package-consumer-smoke.sh

      - name: Pack Origo.Core.Contracts
        run: dotnet pack Origo.Core.Contracts/Origo.Core.Contracts.csproj --no-build --configuration Release --output ./artifacts

      - name: Pack Origo.Core.Kernel
        run: dotnet pack Origo.Core.Kernel/Origo.Core.Kernel.csproj --no-build --configuration Release --output ./artifacts

      - name: Pack Origo.Core
        run: dotnet pack Origo.Core/Origo.Core.csproj --no-build --configuration Release --output ./artifacts

      - name: Pack Origo.GodotAdapter
        run: dotnet pack Origo.GodotAdapter/Origo.GodotAdapter.csproj --no-build --configuration Release --output ./artifacts

      - name: Pack Origo.ConsoleBridge
        run: dotnet pack Origo.ConsoleBridge/Origo.ConsoleBridge.csproj --no-build --configuration Release --output ./artifacts

      - name: Validate release package set
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: bash scripts/validate-release-packages.sh ./artifacts "${TAG#v}"

      - name: Copy NuGet config to artifacts
        run: cp nuget.config.example ./artifacts/nuget.config

      - name: Package documentation snapshot
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          DIRNAME="origo-docs-${VERSION}"
          mkdir -p "${DIRNAME}/docs"
          cp -r docs/. "${DIRNAME}/docs/"
          cp AGENTS.md "${DIRNAME}/"
          cp CHANGELOG.md "${DIRNAME}/"
          cp Directory.Build.props "${DIRNAME}/"
          mkdir -p ./artifacts
          tar -czf "./artifacts/${DIRNAME}.tar.gz" "${DIRNAME}"
          zip -rq "./artifacts/${DIRNAME}.zip" "${DIRNAME}"

      - name: Package release source tree
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p ./artifacts
          git archive \
            --format=tar.gz \
            --prefix="origo-${VERSION}/" \
            --output="artifacts/origo-source-${VERSION}.tar.gz" \
            HEAD

      - name: Validate release source tree
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          bash .release-validators/validate-release-source.sh \
            "artifacts/origo-source-${VERSION}.tar.gz" "$VERSION" \
            "$PWD/.release-validators/verify-release.sh"

      - name: Publish release commit to the tag
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
          BASE_SHA: ${{ steps.tag-commit.outputs.base_sha }}
          BASE_COMMIT_SHA: ${{ steps.tag-commit.outputs.base_commit }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          REMOTE_TAG_REF="$(git rev-parse "refs/tags/${TAG}")"
          REMOTE_TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"

          if [[ "$REMOTE_TAG_COMMIT" == "$RELEASE_SHA" ]]; then
            echo "tag ${TAG} already points at release commit ${RELEASE_SHA}."
            exit 0
          fi
          if [[ "$REMOTE_TAG_REF" != "$BASE_SHA" ]]; then
            echo "ERROR: tag ${TAG} moved from ${BASE_SHA} to ${REMOTE_TAG_REF} during this run." >&2
            exit 1
          fi

          # Only the tag moves. main is PR-protected and must never be written
          # by this workflow; the release commit exists solely as the tag target,
          # so the tagged source archive carries the exact version while main
          # keeps its development baseline.
          git tag -f -a "$TAG" -m "Release ${TAG} from ${BASE_COMMIT_SHA}" "$RELEASE_SHA"
          git push \
            --force-with-lease="refs/tags/${TAG}:${BASE_SHA}" \
            origin "refs/tags/${TAG}"
          echo "tag ${TAG} now points at release commit ${RELEASE_SHA}; main is unchanged."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # A workflow_dispatch run has github.ref_name=main, so use the tag
          # resolved for this run instead of the action's default ref name.
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          # Never let the action create a missing tag at the default branch;
          # if the tag push above failed, the release must fail instead.
          target_commitish: ${{ steps.release-commit.outputs.sha }}
          files: ./artifacts/*
          generate_release_notes: true

      - name: Mark snapshot release as pre-release
        # A boolean workflow input is a Boolean in the inputs context;
        # comparing it with the string 'true' is always false. Any
        # hyphenated tag is a snapshot, including one dispatched without
        # snapshot=true, so it must never become the repository's Latest.
        if: ${{ inputs.snapshot || contains(steps.resolve-tag.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          # The snapshot input and any hyphenated tag force a pre-release, so a
          # snapshot can never take over as the repository's Latest release. Only
          # a formal x.y.z tag pushed or released by hand keeps the state chosen
          # on GitHub.
          gh release edit "${TAG}" --prerelease
          echo "Marked ${TAG} as a pre-release."
