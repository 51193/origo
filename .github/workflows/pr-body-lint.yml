name: PR Body Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  pr-body-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint the PR title/body used for squash-merge commits
        run: |
          set -euo pipefail
          # Always run the reviewed linter from main: a pull request cannot
          # weaken the linter in the same change that relies on a green check.
          # If main no longer ships the linter, fail instead of falling back to
          # the pull-request tree.
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:scripts/python/lint-pr-body.py > "$RUNNER_TEMP/lint-pr-body.py"
          python3 "$RUNNER_TEMP/lint-pr-body.py"
