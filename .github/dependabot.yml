# Godot.NET.Sdk is an MSBuild project SDK reference
# (<Project Sdk="Godot.NET.Sdk/x.y.z">), not a NuGet PackageReference.
# Dependabot's NuGet ecosystem does not update MSBuild SDK references
# (https://github.com/dependabot/dependabot-core/issues/8615, tracked as of
# 2026-10 by https://github.com/dependabot/dependabot-core/pull/15745), so this pin is
# the documented exception to AGENTS.md §1.9's grouping rule: bump it manually
# in all three projects:
#   Origo.GodotAdapter/Origo.GodotAdapter.csproj (authority)
#   Origo.GodotAdapter.Integration.Tests/Origo.GodotAdapter.Integration.Tests.csproj
#   tools/ShellPackageConsumer/OrigoShellPackageConsumer.csproj
# scripts/godot-test.sh, scripts/package-consumer-smoke.sh, and
# scripts/validate-release-packages.sh fail when the pins or the adapter's
# GodotSharp dependency drift.
#
# Dependabot generates the commit subject and body itself; it only supports
# configuring a message prefix, not a full template. Every ecosystem below
# sets the chore(deps) prefix so generated subjects are Conventional Commits.
# scripts/lint-commits.sh skips Dependabot-authored commits because their
# generated body cannot satisfy the 72-character line rule; human-authored
# commits keep the full gate.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # xunit.v3 3.x pins transitive dependencies with exact (=) versions,
      # so xunit.v3 and xunit.v3.extensibility.core must be proposed in a
      # single PR. Bumping only one of them causes NU1608 restore errors in
      # every test project.
      xunit-v3:
        patterns:
          - "xunit.v3"
          - "xunit.v3.extensibility.core"
      # xunit.runner.visualstudio has an independent version line and remains
      # compatible with xunit.v3, so Dependabot may update it separately.
    ignore:
      # Microsoft.CodeAnalysis.* is coupled to the compiler in the SDK pinned
      # by global.json: Origo.SourceGeneration.dll is loaded as an analyzer,
      # and packages newer than the running compiler fail with CS9057.
      # Dependabot cannot coordinate nuget and dotnet-sdk updates in one PR,
      # so all Roslyn package updates are ignored and must be bumped manually
      # together with the matching SDK update.
      - dependency-name: "Microsoft.CodeAnalysis.*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # xunit.v3 4.0 moves test execution to Microsoft Testing Platform and
      # changes assembly parallelization attributes. Accepting the major
      # update requires one coordinated PR that also migrates test projects
      # and scripts/test.sh, so semver-major xunit.v3 bumps are ignored
      # until that migration is performed as a single change.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit.v3.extensibility.core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
